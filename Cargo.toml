[package]
name = "velyx"
version = "0.1.0"
edition = "2024"
authors = ["mjojo <https://github.com/GLK-Dev>"]

[dependencies]
anyhow = "1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["std"] }
raptorq = "1.8"
snow = "0.9"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
